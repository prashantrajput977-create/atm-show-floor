<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vervotech Showdown</title>
<meta name="description" content="Vervotech show floor companion. Your meetings, card capture and deal outcomes for Arabian Travel Market.">
<meta name="theme-color" content="#EEF1F6">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vervotech Showdown">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============ BOOT ============ -->
<div id="boot" style="min-height:100dvh;display:grid;place-items:center;padding:24px">
  <div style="text-align:center">
    <svg viewBox="0 0 32 32" fill="none" style="width:40px;height:40px;color:#1E3FD0;margin:0 auto 14px">
      <g stroke="currentColor" stroke-width="2.7" stroke-linecap="round">
        <path d="M4 11V7a3 3 0 0 1 3-3h4"/><path d="M21 4h4a3 3 0 0 1 3 3v4"/>
        <path d="M28 21v4a3 3 0 0 1-3 3h-4"/><path d="M11 28H7a3 3 0 0 1-3-3v-4"/>
      </g>
      <circle cx="16" cy="16" r="3.9" fill="#2B4FEE"/>
    </svg>
    <div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6B7587;font-weight:700">Vervotech Showdown</div>
  </div>
</div>

<!-- ============ AUTH ============ -->
<div id="authView" hidden>
  <div class="authbg" aria-hidden="true"></div>
  <div class="auth">
    <div class="mark" id="authMark"></div>
    <div class="evtag" id="authEv" hidden></div>
    <h1>Your floor,<br>in your pocket.</h1>
    <p class="sub">Every meeting on your name, every card you scan, every outcome you call. Live across the team.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="li_email">Work email</label>
        <input class="input" id="li_email" type="email" name="email" inputmode="email"
               autocomplete="username" autocapitalize="none" spellcheck="false"
               placeholder="you@vervotech.com" required>
      </div>
      <div class="field">
        <label for="li_pass">Password</label>
        <div style="position:relative">
          <input class="input" id="li_pass" type="password" name="password"
                 autocomplete="current-password" placeholder="••••••••••" required
                 style="padding-right:46px">
          <button type="button" class="iconbtn" id="li_toggle" aria-label="Show password"
                  style="position:absolute;right:4px;top:4px;width:38px;height:38px;border:0;background:transparent"></button>
        </div>
      </div>
      <div class="hint bad" id="li_err" hidden></div>
      <button class="btn primary block" id="li_btn" type="submit" style="margin-top:4px">Sign in</button>
    </form>
    <div class="foot">Vervotech field team only.<br>Works offline once you are in.</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header class="appbar">
    <div class="appbar-row">
      <button class="brandmark" id="evBtn" aria-label="Switch event">
        <span id="bmLogo" style="display:flex"></span>
        <span class="bm-t">
          <span class="bm-1" id="bmName">Vervotech Showdown</span>
          <span class="bm-2" id="bmSub">loading</span>
        </span>
      </button>
      <span class="spacer"></span>
      <button class="sync" id="syncPill" data-state="live" aria-live="polite">
        <span class="dot"></span><span id="syncTx">Live</span>
      </button>
      <button class="avatar" id="meBtn" aria-label="Your profile"></button>
    </div>
    <nav class="dayrail scroll" id="dayrail" aria-label="Event days"></nav>
  </header>

  <main id="main"></main>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-t="today" aria-selected="true">
      <span class="ic"></span><span>Today</span>
    </button>
    <button class="tab" role="tab" data-t="leads" aria-selected="false">
      <span class="ic"></span><span>Leads</span>
    </button>
    <button class="tab scan" role="tab" data-t="scan" aria-selected="false">
      <span class="ring"></span><span>Scan</span>
    </button>
    <button class="tab" role="tab" data-t="board" aria-selected="false">
      <span class="ic"></span><span>Board</span>
    </button>
    <button class="tab" role="tab" data-t="me" aria-selected="false">
      <span class="ic"></span><span>Me</span>
    </button>
  </nav>
</div>

<!-- ============ OVERLAYS ============ -->
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <header class="sheet-h">
    <div class="st">
      <h2 id="sheetTitle"></h2>
      <p id="sheetSub"></p>
    </div>
    <button class="iconbtn" id="sheetX" aria-label="Close"></button>
  </header>
  <div class="sheet-b scroll" id="sheetBody"></div>
  <footer class="sheet-f" id="sheetFoot" hidden></footer>
</section>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="camPick" accept="image/*" capture="environment" hidden>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/ocr.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
